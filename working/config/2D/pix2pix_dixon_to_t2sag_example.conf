# Example Pix2Pix 2D config
# Task: axial Dixon (water/fat/T1w/T2w) -> T2 sagittal
#
# Data expectation: paired, co-registered slices exported as *.npz files
# with keys matching `condition_types` (first key = target, rest = inputs).
# See scripts/datagen/ (dataset_gen_*) and scripts/csv_gen/ (make_csv_*)
# for the preprocessing pipeline you need to build for your own dataset.

# Training
mode: pix2pix
batch_size: 32
lr: 0.00002
max_epochs: 5000
num_cpu: 16
size: 256                        # crop / resize size (2D)
channels: 64
exp_name: pix2pix_dixon_to_t2sag_2D
start_epoch: 0
cpu: false
new: false
gpus: [0]

# Condition setup (medical branch of the dataloader)
# First entry = target modality, following entries = input channels
condition_types: [T2w_sag, water, fat]
conditional: true
learning_type: image

# Dataset: xlsx-file listing paired slice/volume paths per row (train/val),
# generated by a script analogous to scripts/csv_gen/make_csv_stir.py
dataset: /path/to/train_paired.xlsx
volumes: false
target_shape3D: [256, 256]

# Preview / logging
num_validation_images: 4
transpose_preview: true
image_dropout: 0.0

# Model
model_name: unet
net_D_depth: 3
net_D_channel: 64
net_G_depth: 12
net_G_channel: 64
net_G_drop_out: 0.2

# Losses
lambda_GAN: 1.0
lambda_paired: 10.0
lambda_ssim: 1.0
