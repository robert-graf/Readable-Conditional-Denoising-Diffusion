# Example Pix2Pix 3D config
# Task: axial Dixon (water/fat/T1w/T2w) -> T2 sagittal (volumetric)
#
# Only try this AFTER the 2D variant converges — 3D is much more
# memory-hungry and slower to debug.
#
# Data expectation: paired, co-registered volumes exported as *.npz files
# with keys matching `condition_types` (first key = target, rest = inputs).
# See scripts/datagen/ (dataset_gen_*) and scripts/csv_gen/ (make_csv_*)
# for the preprocessing pipeline you need to build for your own dataset.

# Training
mode: pix2pix
batch_size: 2                    # reduce to 1 on OOM
lr: 0.00002
max_epochs: 5000
num_cpu: 16
size: 256
channels: 64
exp_name: pix2pix_dixon_to_t2sag_3D
start_epoch: 0
cpu: false
new: false
gpus: [0]

# Condition setup
condition_types: [T2w_sag, water, fat]
conditional: true
learning_type: image

# Dataset
dataset: /path/to/train_paired.xlsx
volumes: true
target_shape3D: [16, 256, 256]   # [D, H, W] — reduce D on OOM

# Preview / logging
num_validation_images: 4
transpose_preview: true
image_dropout: 0.0

# Model
model_name: unet
net_D_depth: 3
net_D_channel: 64
net_G_depth: 12
net_G_channel: 64
net_G_drop_out: 0.2

# Losses
lambda_GAN: 1.0
lambda_paired: 10.0
lambda_ssim: 1.0
